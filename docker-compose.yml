services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qalqon
      POSTGRES_USER: qalqon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalqon -d qalqon"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    networks:
      default:
        aliases:
          - chekla-bot-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8081}:8081"
    environment:
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN:?TELOXIDE_TOKEN is required}
      DATABASE_URL: postgres://qalqon:${POSTGRES_PASSWORD}@postgres:5432/qalqon
      OWNER_IDS: ${OWNER_IDS:-}
      RUST_LOG: ${RUST_LOG:-qalqon=info,teloxide=info}
      HEALTH_ADDR: 0.0.0.0:8080
      API_ADDR: 0.0.0.0:8081
      MINI_APP_AUTH_MAX_AGE_SECS: ${MINI_APP_AUTH_MAX_AGE_SECS:-3600}
      MINI_APP_ORIGIN: ${MINI_APP_ORIGIN:-}
      MINI_APP_URL: ${MINI_APP_URL:-}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_ALLOW_DEMO: ${VITE_ALLOW_DEMO:-false}
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_started
    ports:
      - "${MINI_APP_BIND_HOST:-127.0.0.1}:${MINI_APP_PORT:-5173}:80"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://frontend:80

volumes:
  postgres_data:
